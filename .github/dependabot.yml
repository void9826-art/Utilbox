# Weekly pull requests for outdated npm packages and GitHub Actions.
# The cooldown skips releases younger than a week, so a freshly published
# (possibly compromised) version is never proposed the day it appears.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
